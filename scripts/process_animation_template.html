<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五种半导体工艺 · 分步动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183344;
      --muted: #485f6b;
      --line: #cbdbe1;
      --accent: #09645c;
      --paper: #f4f8fa;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.65;
      color: var(--ink);
      background: #fbfcfd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1200px, 100% - 56px); margin: 42px auto; }
    h1, h2, p, figure, dl, dd { margin: 0; }
    h1 { font-size: clamp(29px, 5vw, 50px); line-height: 1.2; letter-spacing: -.04em; }
    header > p { color: var(--muted); margin-top: 10px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 23px 0 15px; }
    nav a, button { min-height: 44px; font: inherit; border-radius: 5px; }
    nav a {
      display: inline-flex;
      align-items: center;
      padding: 6px 15px;
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      background: white;
    }
    nav a[aria-current] { background: var(--accent); border-color: var(--accent); color: #fff; }
    :focus-visible { outline: 3px solid #1e78b5; outline-offset: 3px; }
    .bench { display: grid; grid-template-columns: 1.13fr 1fr; border: 1px solid var(--line); background: #fff; }
    .visual { background: var(--paper); border-right: 1px solid var(--line); padding: 20px 22px; }
    .visual svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 15px; color: var(--muted); font-size: .84rem; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: .84em; height: .84em; border-radius: 2px; border: 1px solid #243b4b66; }
    figcaption { margin-top: 12px; color: #394f59; font-size: .9rem; }
    .explain { padding: 23px 26px; }
    .counter { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    h2 { font-size: clamp(21px, 3vw, 31px); line-height: 1.32; margin: 5px 0 17px; }
    dt { font-weight: 750; margin-top: 12px; }
    dd { color: #304957; margin-top: 3px; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: 13px 0 10px; }
    button { padding: 6px 17px; border: 1px solid var(--line); background: white; color: var(--ink); cursor: pointer; }
    #next { background: var(--accent); color: white; border-color: var(--accent); }
    button:disabled, #next:disabled { background: #e7eef0; color: #536571; border-color: #d2dfe2; cursor: default; }
    .keyboard { color: var(--muted); font-size: .88rem; margin-left: auto; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; margin-top: 18px; padding-top: 13px; }
    footer a { color: var(--accent); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .play { animation: appear 230ms ease-out both; }
    .play .reveal, .play .heat { animation: appear 480ms ease-out both; }
    .play .travel { animation: travel 470ms ease-out both; }
    .play .lift { animation: lift 560ms ease-out both; }
    .play .spread { animation: spread 490ms ease-out both; transform-box: fill-box; transform-origin: center; }
    .play .fill-up { animation: fill-up 540ms ease-out both; }
    .play .trace { stroke-dasharray: 1000; animation: trace 600ms ease-out both; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes travel { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes lift { 0% { opacity: .85; transform: translateY(22px); } 70% { opacity: .95; } 100% { opacity: 0; transform: translateY(-15px); } }
    @keyframes spread { from { transform: scaleX(.06); opacity: .45; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes fill-up { from { clip-path: inset(75% 0 0); } to { clip-path: inset(0); } }
    @keyframes trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (max-width: 740px) {
      main { width: calc(100% - 28px); margin: 23px auto; }
      .bench { grid-template-columns: 1fr; }
      .visual { padding: 10px 13px; border-right: 0; border-bottom: 1px solid var(--line); }
      .explain { padding: 17px; }
      .keyboard { display: none; }
      nav { gap: 6px; margin-top: 17px; }
      nav a { padding-inline: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>五种半导体工艺</h1>
    <p>选择一种工艺。每点击一次「下一步」，就看一次加工变化。</p>
  </header>
  <nav aria-label="选择工艺" id="processes"></nav>
  <noscript>请启用 JavaScript。也可以回到原书章节，逐项展开图解。</noscript>
  <div id="reader" hidden>
    <div class="bench">
      <figure class="visual">
        <div id="diagram" aria-hidden="true"></div>
        <div class="legend" id="legend" aria-label="材料图例"></div>
        <figcaption id="caption"></figcaption>
      </figure>
      <section class="explain" aria-labelledby="step-title">
        <p id="counter" class="counter"></p>
        <h2 id="step-title"></h2>
        <dl>
          <dt>这一步做什么</dt>
          <dd id="what"></dd>
          <dt>为什么做</dt>
          <dd id="why"></dd>
        </dl>
      </section>
    </div>
    <div class="controls">
      <button type="button" id="prev">上一步</button>
      <button type="button" id="next">下一步</button>
      <button type="button" id="reset">回到第一步</button>
      <span class="keyboard">也可以用键盘 ← / →</span>
    </div>
    <div id="announcement" class="sr-only" role="status"></div>
    <footer>
      <p id="intro"></p>
      <p>教学剖面，材料厚度和形状均作示意。<a id="chapter">读原书章节</a> · <a id="reference">参考资料</a></p>
      <p>根据《半导体制造概论》作者与贡献者的内容绘制，沿用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>。</p>
    </footer>
  </div>
</main>
<script type="application/json" id="book-data">@@BOOK_DATA@@</script>
<script>
  "use strict";
  const { processes, materials } = JSON.parse(document.getElementById("book-data").textContent);
  const byId = (id) => document.getElementById(id);
  const links = new Map();
  let previousProcess = null;
  let previousIndex = null;

  function parseLocation() {
    const [id, position] = location.hash.slice(1).split("/");
    const process = processes.find((item) => item.id === id) ?? processes[0];
    const step = /^\d+$/.test(position ?? "") ? Number(position) : 1;
    const index = Math.max(0, Math.min(process.steps.length - 1, step - 1));
    return { process, index };
  }

  function navigate(index) {
    const { process } = parseLocation();
    if (index < 0 || index >= process.steps.length) return;
    location.hash = process.id + "/" + (index + 1);
  }

  function render() {
    const { process, index } = parseLocation();
    const processChanged = process !== previousProcess;
    const stepChanged = index !== previousIndex;
    const { title, what, why, caption, drawing } = process.steps[index];
    if (!processChanged && !stepChanged) return;
    const counter = `${process.name} · 第 ${index + 1} / ${process.steps.length} 步`;
    if (processChanged) {
      for (const [id, link] of links) {
        if (id === process.id) link.setAttribute("aria-current", "true");
        else link.removeAttribute("aria-current");
      }
      byId("legend").replaceChildren(...process.legend.map((key) => {
        const [name, color] = materials[key];
        const item = document.createElement("span");
        const swatch = document.createElement("i");
        swatch.className = "swatch";
        swatch.style.backgroundColor = color;
        item.append(swatch, name);
        return item;
      }));
      byId("chapter").href = process.chapterUrl;
      byId("reference").href = process.ref[1];
      byId("reference").textContent = process.ref[0];
      byId("intro").textContent = process.intro;
    }
    byId("diagram").innerHTML = drawing;
    if (previousProcess) byId("diagram").firstElementChild.classList.add("play");
    for (const [id, value] of Object.entries({ counter, "step-title": title, what, why, caption })) {
      byId(id).textContent = value;
    }
    const focusWasOnNext = document.activeElement === byId("next");
    const focusWasOnPrevious = document.activeElement === byId("prev");
    byId("prev").disabled = index === 0;
    byId("next").disabled = index === process.steps.length - 1;
    byId("reset").disabled = index === 0;
    if (focusWasOnNext && byId("next").disabled) byId("prev").focus();
    if (focusWasOnPrevious && byId("prev").disabled) byId("next").focus();
    if (previousProcess) byId("announcement").textContent = counter + " " + title;
    previousProcess = process;
    previousIndex = index;
  }

  for (const process of processes) {
    const link = document.createElement("a");
    link.href = "#" + process.id + "/1";
    link.textContent = process.name;
    links.set(process.id, link);
    byId("processes").append(link);
  }
  byId("prev").addEventListener("click", () => navigate(parseLocation().index - 1));
  byId("next").addEventListener("click", () => navigate(parseLocation().index + 1));
  byId("reset").addEventListener("click", () => {
    navigate(0);
    byId("next").focus();
  });
  window.addEventListener("hashchange", render);
  document.addEventListener("keydown", (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      navigate(parseLocation().index + (event.key === "ArrowRight" ? 1 : -1));
    }
  });
  byId("reader").hidden = false;
  render();
</script>
</body>
</html>
